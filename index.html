<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PM-pal</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#1e6fd9">
</head>
<body>
  <h1>PM-pal works</h1>

<script src="https://cdn.jsdelivr.net/npm/idb@8.0.0/build/umd.js"></script>
<script>
  // 1. Open the DB once, at the top
  const dbPromise = idb.openDB("pmpal", 1, {
    upgrade(db) { db.createObjectStore("assets", { keyPath: "id" }); }
  });

  // 2. Boot checks the DB instead of localStorage
  async function boot() {
  try {
    const db = await dbPromise;
    if (await db.count("assets") === 0) showImportScreen();
    else showHomeScreen();
  } catch (err) {
    document.body.innerHTML = "<pre>" + err + "</pre>";
  }
}

  // 3. The import handler parses the CSV and writes the rows
  async function importFile(file) {
    const text = await file.text();
    const rows = /* the split/map parsing */;
    const db = await dbPromise;
    const tx = db.transaction("assets", "readwrite");
    rows.forEach(r => tx.store.put(r));
    await tx.done;
    boot();
  }

  function showImportScreen() {
  document.body.innerHTML = `
    <h1>Import equipment list</h1>
    <input type="file" accept=".json,.csv" id="import">`;

  document.getElementById("import").onchange = async e => {
    const text = await e.target.files[0].text();
    localStorage.setItem("assets", JSON.stringify(JSON.parse(text)));
    boot();
  };
}

  boot();

    
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
  </script>
</body>
</html>
