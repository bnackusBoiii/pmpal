<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PM-pal</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#1e6fd9">
</head>
<body>
  <h1>PM-pal works</h1>

  <script>

    function loadAssets() {
  try {
    return JSON.parse(localStorage.getItem("assets")) || [];
  } catch {
    return [];
  }
}

function boot() {
  const assets = loadAssets();
  if (assets.length === 0) showImportScreen();
  else showHomeScreen();
}

function showImportScreen() {
  document.body.innerHTML = `
    <h1>Import equipment list</h1>
    <input type="file" accept=".json,.csv" id="import">`;

  document.getElementById("import").onchange = async e => {
    const text = await e.target.files[0].text();
    localStorage.setItem("assets", JSON.stringify(JSON.parse(text)));
    boot();
  };
}
    
boot();

    
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
  </script>
</body>
</html>
