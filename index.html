<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PM-pal</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#1e6fd9">

<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; }
  input, button { font-size: 18px; padding: 12px; width: 100%; box-sizing: border-box; margin-bottom: 8px; }
  .card { border: 1px solid #ddd; border-radius: 10px; padding: 12px; margin-top: 8px; }
  .id   { font-weight: 700; font-size: 18px; }
  .desc { margin-top: 2px; }
  .loc  { margin-top: 2px; color: #666; font-size: 14px; }
</style>
  
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/idb@8.0.0/build/umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    const app = document.getElementById("app");

    const intervals = { quarterly: 3, semiannual: 6, annual: 12, biennial: 24 };
    const defaultProcedures = [
  {
    id: "centrifuge-pm",
    name: "Centrifuge PM",
    version: 1,
    intervalMonths: 12,
    match: ["CENTRIFUGE"],
    steps: [
      { label: "Visual inspection, no cracks or damage", kind: "check", required: true },
      { label: "Set speed (RPM)",    kind: "number", required: true },
      { label: "Actual speed (RPM)", kind: "number", required: true },
      { label: "Timer accurate",     kind: "check",  required: true },
      { label: "Notes",              kind: "text" }
    ]
  }
];

    function findProcedure(asset) {
      const desc = asset.description.toUpperCase();
      return procs.find(p => p.match.some(m => desc.includes(m)));
    }

    // ---------- Database ----------
    const dbPromise = idb.openDB("pmpal", 3, {
      upgrade(db, oldVersion) {
        if (oldVersion < 1) db.createObjectStore("assets", { keyPath: "id" });
        if (oldVersion < 2) db.createObjectStore("records", { autoIncrement: true });
        if (oldVersion < 3) db.createObjectStore("procedures", { keyPath: "id" });
      }
    });

    // ---------- CSV parsing ----------
    function parseCSV(text) {
      text = text.replace(/^\uFEFF/, "");
      const rows = [];
      let row = [], field = "", inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
          if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
          else if (c === '"') inQuotes = false;
          else field += c;
        } else if (c === '"') inQuotes = true;
        else if (c === ",") { row.push(field); field = ""; }
        else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
        else if (c !== "\r") field += c;
      }
      if (field || row.length) { row.push(field); rows.push(row); }
      return rows;
    }

    // ---------- Import ----------
    async function importFile(file) {
      app.innerHTML = "<p>Importing...</p>";
      const text = await file.text();
      const rows = parseCSV(text)
        .slice(1) // skip header row
        .map(([id, description, location]) => ({
          id: (id || "").trim(),
          description: (description || "").trim(),
          location: (location || "").trim()
        }))
        .filter(r => r.id);

      const db = await dbPromise;
      const tx = db.transaction("assets", "readwrite");
      rows.forEach(r => tx.store.put(r));
      await tx.done;
      boot();
    }

    // ---------- Screens ----------
    function showImportScreen() {
      app.innerHTML = `
        <h1>Import equipment list</h1>
        <input type="file" accept=".csv" id="import">`;
      document.getElementById("import").onchange = e => importFile(e.target.files[0]);
    }

    let all = [];

    async function showHomeScreen() {
      app.innerHTML = `
        <h1>PM-pal</h1>
        <input id="search" placeholder="ID, description, or location"
               autocapitalize="characters" autocorrect="off" spellcheck="false">
        <button id="scan">Scan</button>
        <div id="reader"></div>
        <div id="results"></div>`;

      all = await (await dbPromise).getAll("assets");

      function runSearch(q) {
        q = q.trim().toUpperCase();
        if (!q) { document.getElementById("results").innerHTML = ""; return; }
        const hits = all
          .filter(a => (a.id + " " + a.description + " " + a.location).toUpperCase().includes(q))
          .slice(0, 20);
        document.getElementById("results").innerHTML = hits.map(a => `
          <div class="card" data-id="${a.id}">
          <div class="id">${a.id}</div>
          <div class="desc">${a.description}</div>
          <div class="loc">${a.location}</div>
          </div>`).join("");
      }

      document.getElementById("search").oninput = e => runSearch(e.target.value);

      document.getElementById("scan").onclick = async () => {
        const scanner = new Html5Qrcode("reader");
        await scanner.start(
          { facingMode: "environment" },          // rear camera
          { fps: 10 },
          async text => {
            await scanner.stop();                 // close the camera
            document.getElementById("search").value = text;
            runSearch(text);                      // same function your typing uses
          }
        );
      };

      document.getElementById("results").onclick = e => {
        const card = e.target.closest(".card");
        if (!card) return;
        const asset = all.find(a => a.id === card.dataset.id);
        showAssetScreen(asset);
      };
    }

    function showAssetScreen(asset) {
      app.innerHTML = `
        <button id="back">← Back</button>
        <h1>${asset.id}</h1>
        <p>${asset.description}</p>
        <p>${asset.location}</p>
        <button id="start">Start PM</button>`;

      document.getElementById("back").onclick = showHomeScreen;
      document.getElementById("start").onclick = () => {
        const proc = findProcedure(asset);
        if (!proc) { alert("No PM procedure for this equipment yet"); return; }
        runProcedure(asset, proc);
      };
    }

    function runProcedure(asset, proc) {
      const fields = proc.steps.map((s, i) => {
        const input =
          s.kind === "check"  ? `<input type="checkbox" id="f${i}">` :
          s.kind === "number" ? `<input type="number" inputmode="decimal" id="f${i}">` :
                            `<input type="text" id="f${i}">`;
          return `<label class="step">
            <span>${s.label}${s.required ? " *" : ""}</span>
            ${input}
            </label>`;
            }).join("");

      app.innerHTML = `
        <button id="back">← Back</button>
        <h2>${proc.name}</h2>
        <p>${asset.id}: ${asset.description}</p>
        ${fields}
        <button id="finish">Finish</button>`;

      document.getElementById("back").onclick = () => showAssetScreen(asset);

      document.getElementById("finish").onclick = async () => {
        const values = {};
        let missing = false;

        proc.steps.forEach((s, i) => {
          const el = document.getElementById("f" + i);
          const v = s.kind === "check" ? el.checked : el.value.trim();
          const empty = v === "" || (s.kind === "check" && v === false);
          el.closest(".step").classList.toggle("missing", s.required && empty);
          if (s.required && empty) missing = true;
          values[s.label] = v;
        });

        if (missing) return;
        // save the record here
  };
}

    function showProcEditor(proc) {
      const p = structuredClone(proc);

      function draw() {
        app.innerHTML = `
          <button id="cancel">← Cancel</button>
          <input id="name" value="${p.name}">
          <select id="interval">
            ${[3, 6, 12, 24].map(m => `<option value="${m}" ${p.intervalMonths === m ? "selected" : ""}>${m} months</option>`).join("")}
          </select>
          <input id="match" value="${p.match.join(", ")}" placeholder="Matches descriptions containing...">
          <input id="tmpl" value="${p.exportTemplate || ""}" placeholder="Export template">
          ${p.steps.map((s, i) => `
            <div class="stepRow">
              <input data-i="${i}" data-f="label" value="${s.label}">
              <select data-i="${i}" data-f="kind">
                ${["check", "number", "text"].map(k => `<option ${s.kind === k ? "selected" : ""}>${k}</option>`).join("")}
              </select>
              <label><input type="checkbox" data-i="${i}" data-f="required" ${s.required ? "checked" : ""}> req</label>
              <button data-up="${i}">↑</button><button data-del="${i}">✕</button>
            </div>`).join("")}
          <button id="addStep">+ Add step</button>
          <button id="save">Save</button>`;
        // wire handlers (below)

        app.querySelectorAll("[data-f]").forEach(el => {
        el.onchange = () => {
          const s = p.steps[el.dataset.i];
          s[el.dataset.f] = el.type === "checkbox" ? el.checked : el.value;
        };
      });

      document.getElementById("addStep").onclick = () => {
        p.steps.push({ key: "", label: "New step", kind: "check", required: false });
        draw();
      };
      // data-del: p.steps.splice(i, 1); draw()
      // data-up:  swap p.steps[i] with p.steps[i - 1]; draw()

      document.getElementById("save").onclick = async () => {
      p.name = document.getElementById("name").value.trim();
      p.intervalMonths = Number(document.getElementById("interval").value);
      p.match = document.getElementById("match").value.split(",").map(m => m.trim().toUpperCase()).filter(Boolean);
      p.exportTemplate = document.getElementById("tmpl").value;
      p.steps.forEach(s => { if (!s.key) s.key = s.label.toLowerCase().replace(/\W+/g, "_"); });
      p.version++;

      await (await dbPromise).put("procedures", p);
      await loadProcs();
      showProcList();
    };
        
      }
      draw();
    }

    // ---------- Boot ----------
    async function boot() {
      let procs = [];
      
      try {
        const db = await dbPromise;
        if (await db.count("assets") === 0) showImportScreen();
        else showHomeScreen();

        if (await db.count("procedures") === 0) {
          for (const p of defaultProcedures) await db.put("procedures", p);
        }
        
        procs = await db.getAll("procedures")
        
      } catch (err) {
        app.innerHTML = "<pre>" + err + "</pre>";
      }

      
      
    }

    boot();

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
  </script>
</body>
</html>
