<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PM-pal</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#1e6fd9">

  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 16px;
    }

    select {
      font-size: 18px;
      padding: 12px;
      width: 100%;
      box-sizing: border-box;
    }

    input,
    button {
      font-size: 18px;
      padding: 12px;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 8px;
    }

    .runHead {
      margin: 8px 0 12px;
    }

    .runHead h2 {
      margin: 0 0 4px;
    }

    .assetLine {
      font-size: 16px;
    }

    .assetLoc {
      color: #666;
      font-size: 14px;
      margin-top: 2px;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      margin-top: 8px;
    }

    .id {
      font-weight: 700;
      font-size: 18px;
    }

    .desc {
      margin-top: 2px;
    }

    .loc {
      margin-top: 2px;
      color: #666;
      font-size: 14px;
    }


    /* shared */
    button {
      border: 0;
      border-radius: 10px;
      background: #1e6fd9;
      color: #fff;
      font-size: 16px;
      padding: 12px;
      cursor: pointer;
    }

    button:active {
      opacity: .7;
    }

    select,
    input[type=text],
    input:not([type]) {
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #fff;
    }

    /* top fields */
    .field {
      display: block;
      margin: 12px 0 0;
      font-size: 13px;
      color: #555;
      font-weight: 600;
    }

    .field input,
    .field select {
      display: block;
      margin-top: 4px;
      font-weight: 400;
      color: #000;
    }

    /* step cards */
    .stepRow {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      grid-template-areas:
        "lbl lbl lbl"
        "kind req btns";
      gap: 8px;
      align-items: center;
      background: #f6f7f9;
      border: 1px solid #e2e4e8;
      border-radius: 12px;
      padding: 10px;
      margin: 10px 0;
    }

    .stepRow .lbl {
      grid-area: lbl;
      margin: 0;
    }

    .stepRow select {
      grid-area: kind;
      font-size: 16px;
      padding: 10px;
      width: 100%;
      margin: 0;
    }

    .stepRow .req {
      grid-area: req;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }

    .stepRow .req input {
      width: 24px;
      height: 24px;
      margin: 0;
    }

    .stepRow .btns {
      grid-area: btns;
      display: flex;
      gap: 6px;
    }

    .stepRow .btns button {
      width: 44px;
      padding: 10px 0;
      background: #6b7280;
    }

    .stepRow .btns .danger {
      background: #d33;
    }

    /* action buttons */
    #addStep {
      background: #e8f0fc;
      color: #1e6fd9;
      width: 100%;
      margin-top: 4px;
    }

    #save {
      width: 100%;
      margin-top: 16px;
      padding: 16px;
      font-weight: 700;
    }

    #cancel {
      background: #6b7280;
      margin-bottom: 8px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: #1a7f37;
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 700;
      z-index: 10;
    }

    .toast.bad {
      background: #c62828;
    }

    textarea.lbl {
      grid-area: lbl;
      width: 100%;
      box-sizing: border-box;
      font: inherit;
      font-size: 16px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
      resize: vertical;
    }

    .instruction {
      white-space: pre-wrap;
      background: #fff8e1;
      border-left: 4px solid #f5b800;
      border-radius: 8px;
      padding: 12px;
      margin: 10px 0;
    }

    /* step cards */
    .step {
      display: block;
      background: #f6f7f9;
      border: 1px solid #e2e4e8;
      border-radius: 12px;
      padding: 12px;
      margin: 10px 0;
    }

    .stepLabel {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .star {
      color: #d33;
    }

    .step input[type=number],
    .step input[type=text] {
      width: 100%;
      margin: 0;
      box-sizing: border-box;
    }

    /* checkbox steps: label left, big box right, whole card is tappable */
    .step.check {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .step.check .stepLabel {
      margin: 0;
    }

    .step.check input {
      width: 32px;
      height: 32px;
      flex: none;
      margin: 0;
    }

    /* skipped required step */
    .step.missing {
      border-color: #d33;
      background: #fdecec;
    }

    .step.missing .stepLabel {
      color: #c00;
    }

    #finish {
      width: 100%;
      margin-top: 16px;
      padding: 16px;
      font-weight: 700;
      background: #1a7f37;
    }
  </style>

</head>

<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/idb@8.0.0/build/umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    const app = document.getElementById("app");

    const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    const intervals = { quarterly: 3, semiannual: 6, annual: 12, biennial: 24 };
    const defaultProcedures = [
      {
        id: "centrifuge-pm",
        name: "Centrifuge PM",
        version: 1,
        intervalMonths: 12,
        match: ["CENTRIFUGE"],
        steps: [
          { label: "Visual inspection, no cracks or damage", kind: "check", required: true },
          { label: "Set speed (RPM)", kind: "number", required: true },
          { label: "Actual speed (RPM)", kind: "number", required: true },
          { label: "Timer accurate", kind: "check", required: true },
          { label: "Notes", kind: "text" }
        ]
      }
    ];

    let scanner = null;

    async function stopScan() {
      if (!scanner) return;
      try { await scanner.stop(); } catch { }
      scanner = null;
      document.getElementById("scan").textContent = "Scan";
    }

    async function startScan() {
      scanner = new Html5Qrcode("reader");
      document.getElementById("scan").textContent = "Cancel scan";
      try {
        await scanner.start(
          { facingMode: "environment" },
          { fps: 10 },
          async text => {
            await stopScan();
            document.getElementById("search").value = text;
            runSearch(text);
          }
        );
      } catch (err) {
        await stopScan();
        toast("Camera unavailable", true);
      }
    }

    function toast(msg, bad) {
      const t = document.createElement("div");
      t.className = "toast" + (bad ? " bad" : "");
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2200);
    }

    function addMonths(iso, months) {
      const d = new Date(iso);
      d.setMonth(d.getMonth() + months);
      return d.toISOString().slice(0, 10);
    }

    function findProcedure(asset) {
      const desc = asset.description.toUpperCase();
      return procs.find(p => p.match.some(m => desc.includes(m)));
    }

    let procs = [];

    async function loadProcs() {
      const db = await dbPromise;
      if (await db.count("procedures") === 0) {
        for (const p of defaultProcedures) await db.put("procedures", p);
      }
      procs = await db.getAll("procedures");
    }

    // ---------- Database ----------
    const dbPromise = idb.openDB("pmpal", 3, {
      upgrade(db, oldVersion) {
        if (oldVersion < 1) db.createObjectStore("assets", { keyPath: "id" });
        if (oldVersion < 2) db.createObjectStore("records", { autoIncrement: true });
        if (oldVersion < 3) db.createObjectStore("procedures", { keyPath: "id" });
      }
    });

    // ---------- CSV parsing ----------
    function parseCSV(text) {
      text = text.replace(/^\uFEFF/, "");
      const rows = [];
      let row = [], field = "", inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
          if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
          else if (c === '"') inQuotes = false;
          else field += c;
        } else if (c === '"') inQuotes = true;
        else if (c === ",") { row.push(field); field = ""; }
        else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
        else if (c !== "\r") field += c;
      }
      if (field || row.length) { row.push(field); rows.push(row); }
      return rows;
    }

    // ---------- Import ----------
    async function importFile(file) {
      app.innerHTML = "<p>Importing...</p>";
      const text = await file.text();
      const rows = parseCSV(text)
        .slice(1) // skip header row
        .map(([id, description, location]) => ({
          id: (id || "").trim(),
          description: (description || "").trim(),
          location: (location || "").trim()
        }))
        .filter(r => r.id);

      const db = await dbPromise;
      const tx = db.transaction("assets", "readwrite");
      rows.forEach(r => tx.store.put(r));
      await tx.done;
      boot();
    }

    // ---------- Screens ----------
    function showImportScreen() {
      app.innerHTML = `
        <h1>Import equipment list</h1>
        <input type="file" accept=".csv" id="import">`;
      document.getElementById("import").onchange = e => importFile(e.target.files[0]);
    }

    let all = [];

    async function showHomeScreen() {
      app.innerHTML = `
        <h1>PM-pal</h1>
        <input id="search" placeholder="ID, description, or location"
               autocapitalize="characters" autocorrect="off" spellcheck="false">
        <button id="scan">Scan</button>
        <div id="reader"></div>
        <div id="results"></div>`;

      all = await (await dbPromise).getAll("assets");

      function runSearch(q) {
        q = q.trim().toUpperCase();
        if (!q) { document.getElementById("results").innerHTML = ""; return; }
        const hits = all
          .filter(a => (a.id + " " + a.description + " " + a.location).toUpperCase().includes(q))
          .slice(0, 20);
        document.getElementById("results").innerHTML = hits.map(a => `
          <div class="card" data-id="${a.id}">
          <div class="id">${a.id}</div>
          <div class="desc">${a.description}</div>
          <div class="loc">${a.location}</div>
          </div>`).join("");
      }

      document.getElementById("search").oninput = e => runSearch(e.target.value);

      document.getElementById("scan").onclick = () => scanner ? stopScan() : startScan();
      document.getElementById("search").onfocus = stopScan;

      document.getElementById("results").onclick = e => {
        const card = e.target.closest(".card");
        if (!card) return;
        const asset = all.find(a => a.id === card.dataset.id);
        showAssetScreen(asset);
      };
    }

    function showAssetScreen(asset) {
      app.innerHTML = `
        <button id="back">← Back</button>
        <h1>${asset.id}</h1>
        <p>${asset.description}</p>
        <p>${asset.location}</p>
        <button id="editPM">Edit PM</button>
        <button id="start">Start PM</button>`;


      document.getElementById("back").onclick = showHomeScreen;
      document.getElementById("start").onclick = () => {
        const proc = findProcedure(asset);
        if (!proc) { alert("No PM procedure for this equipment yet"); return; }
        runProcedure(asset, proc);
      };
      document.getElementById("editPM").onclick = () => {
        const proc = findProcedure(asset);
        showProcEditor(proc, asset);
      };
    }

    function runProcedure(asset, proc) {
      const fields = proc.steps.map((s, i) => {
        if (s.kind === "instruction") {
          return `<div class="instruction">${esc(s.label)}</div>`;
        }

        const input =
          s.kind === "check" ? `<input type="checkbox" id="f${i}">` :
            s.kind === "number" ? `<input type="number" inputmode="decimal" id="f${i}">` :
              `<input type="text" id="f${i}">`;

        return `<label class="step ${s.kind}">
    <span class="stepLabel">${esc(s.label)}${s.required ? '<b class="star"> *</b>' : ""}</span>
    ${input}
  </label>`;
      }).join("");

      app.innerHTML = `
  <button id="back">← Back</button>
  <div class="runHead">
    <h2>${esc(proc.name)}</h2>
    <div class="assetLine"><b>${esc(asset.id)}</b> · ${esc(asset.description)}</div>
    <div class="assetLoc">${esc(asset.location)}</div>
  </div>
  ${fields}
  <button id="finish">Finish</button>`;

      document.getElementById("back").onclick = () => showAssetScreen(asset);

      document.getElementById("finish").onclick = async () => {
        const values = {};
        let firstMissing = null;

        proc.steps.forEach((s, i) => {
          if (s.kind === "instruction") return;
          const el = document.getElementById("f" + i);
          const v = s.kind === "check" ? el.checked : el.value.trim();
          const empty = v === "" || v === false;
          const card = el.closest(".step");
          card.classList.toggle("missing", s.required && empty);
          if (s.required && empty && !firstMissing) firstMissing = card;
          values[s.key || s.label] = v;
        });

        if (firstMissing) {
          toast("Missing required steps", true);
          firstMissing.scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }

        try {
          const date = new Date().toISOString();
          await (await dbPromise).add("records", {
            assetId: asset.id,
            procedure: proc.id,
            version: proc.version,
            date,
            nextDue: addMonths(date, proc.intervalMonths),
            values
          });
          toast("PM saved ✓");
          showAssetScreen(asset);
        } catch (err) {
          toast("Save failed", true);
        }
      };
    }

    function showProcEditor(proc, asset) {

      const p = proc
        ? structuredClone(proc)
        : {
          id: crypto.randomUUID(),
          name: asset.description
            ? asset.description.toLowerCase() + " Procedure"
            : "New Precedure",
          version: 1,
          intervalMonths: 12,
          match: asset.description
            ? [asset.description.toUpperCase()]
            : [],
          steps: []
        };

      function syncTop() {
        p.name = document.getElementById("name").value;
        p.intervalMonths = Number(document.getElementById("interval").value);
        p.match = document.getElementById("match").value.split(",").map(m => m.trim().toUpperCase()).filter(Boolean);
        p.exportTemplate = document.getElementById("tmpl").value;
      }

      function move(from, to) {
        if (to < 0 || to >= p.steps.length) return;
        const [s] = p.steps.splice(from, 1);   // pull it out
        p.steps.splice(to, 0, s);              // drop it in
        draw();
      }

      function draw() {
        app.innerHTML = `
          <button id="cancel">← Cancel</button>
          <label class="field">Precedure Name <input id="name" value="${p.name}"> </label>
          <label class="field">Repeats Every <select id="interval">
            ${[3, 6, 12, 24].map(m => `<option value="${m}" ${p.intervalMonths === m ? "selected" : ""}>${m} months</option>`).join("")}
          </select></label>
          <label class="field">Matches descriptions containing <input id="match" value="${p.match.join(", ")}" placeholder="Matches descriptions containing..."></label>
          <label class="field">Export template <input id="tmpl" value="${p.exportTemplate || ""}" placeholder="Export template"></label>
          ${p.steps.map((s, i) => `
            <div class="stepRow">
              ${s.kind === "instruction"
            ? `<textarea class="lbl" rows="5" data-i="${i}" data-f="label">${esc(s.label)}</textarea>`
            : `<input class="lbl" data-i="${i}" data-f="label" value="${esc(s.label)}">`}
              <select data-i="${i}" data-f="kind">
                ${["check", "number", "text", "instruction"].map(k => `<option ${s.kind === k ? "selected" : ""}>${k}</option>`).join("")}
              </select>
              <label class="req"><input type="checkbox" data-i="${i}" data-f="required" ${s.required ? "checked" : ""}> Required</label>
              <div class="btns">
                <button data-up="${i}">↑</button>
                <button data-down="${i}">↓</button>
                <button class="danger" data-del="${i}">✕</button>
              </div>
            </div>`).join("")}
          <button id="addStep">+ Add step</button>
          <button id="save">Save</button>`;
        // wire handlers (below)

        app.querySelectorAll("[data-f]").forEach(el => {
          el.onchange = () => {
            const s = p.steps[el.dataset.i];
            s[el.dataset.f] = el.type === "checkbox" ? el.checked : el.value;
            if (el.dataset.f === "kind") { syncTop(); draw(); }
          };
        });



        app.querySelectorAll("[data-up]").forEach(b => {
          b.onclick = () => { syncTop(); move(+b.dataset.up, +b.dataset.up - 1); };
        });

        app.querySelectorAll("[data-down]").forEach(b => {
          b.onclick = () => { syncTop(); move(+b.dataset.down, +b.dataset.down + 1); };
        });

        app.querySelectorAll("[data-del]").forEach(b => {
          b.onclick = () => { syncTop(); p.steps.splice(+b.dataset.del, 1); draw(); };
        });


        document.getElementById("cancel").onclick = () => {
          showAssetScreen(asset);
        };
        document.getElementById("addStep").onclick = () => {
          p.steps.push({ key: "", label: "New step", kind: "check", required: false });
          draw();
        };
        // data-del: p.steps.splice(i, 1); draw()
        // data-up:  swap p.steps[i] with p.steps[i - 1]; draw()

        document.getElementById("save").onclick = async () => {
          p.name = document.getElementById("name").value.trim();
          p.intervalMonths = Number(document.getElementById("interval").value);
          p.match = document.getElementById("match").value.split(",").map(m => m.trim().toUpperCase()).filter(Boolean);
          p.exportTemplate = document.getElementById("tmpl").value;
          p.steps.forEach(s => { if (!s.key) s.key = esc(s.label).toLowerCase().replace(/\W+/g, "_"); });
          p.version++;

          try {
            await (await dbPromise).put("procedures", p);
            await loadProcs();
            toast("Saved ✓");

            showAssetScreen(asset);

          } catch (err) {
            toast("Save failed");
            await loadProcs();
            showProcList();
          }


        };

      }
      draw();
    }

    // ---------- Boot ----------
    async function boot() {

      try {
        const db = await dbPromise;
        if (await db.count("assets") === 0) showImportScreen();
        else showHomeScreen();

        await loadProcs()

      } catch (err) {
        app.innerHTML = "<pre>" + err + "</pre>";
      }



    }

    boot();

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
  </script>
</body>

</html>
