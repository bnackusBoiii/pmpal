<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PM-pal</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#1e6fd9">

  <style>
    :root {
      --due: rgba(255, 214, 0, .45);
      --due-edge: #f5b800;
      --due-ink: #4d3b00;
      /* dark brown text, readable on the yellow */
    }

    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 16px;
    }

    select {
      font-size: 18px;
      padding: 12px;
      width: 100%;
      box-sizing: border-box;
    }

    input,
    button {
      font-size: 18px;
      padding: 12px;
      width: 100%;
      box-sizing: border-box;
      margin: 5px;
    }

    .runHead {
      margin: 8px 0 12px;
    }

    .runHead h2 {
      margin: 0 0 4px;
    }

    .assetLine {
      font-size: 16px;
    }

    .assetLoc {
      color: #666;
      font-size: 14px;
      margin-top: 2px;
    }

    .card {
      background-size: cover;
      background-position: center;
      border-radius: 12px;
      min-height: 96px;
      background-color: #eeeeee;
      margin: 5px;
      padding: 5px;
    }

    .card.hasPhoto {
      min-height: 96px;
      background-image: var(--photo);
    }

    .card .info {
      display: inline-block;
      max-width: 100%;
      background: rgba(0, 0, 0, .20);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff;
      border-radius: 12px;
      padding: 6px 10px;

    }

    .card.due {
      background-color: var(--due);
      background-image: linear-gradient(var(--due), var(--due)), var(--photo);
    }

    #snooze {
      background: var(--due);
      color: var(--due-ink);
      border: 1px solid var(--due-edge);
      font-weight: 600;
    }

    .dueHead {
      color: var(--due-ink);
      border-left: 4px solid var(--due-edge);
      padding-left: 8px;
    }

    .id {
      font-weight: 700;
      font-size: 18px;
    }

    .desc {
      margin-top: 2px;
    }

    .loc {
      margin-top: 2px;
      color: #666;
      font-size: 14px;
    }

    .card.hasPhoto .loc {
      color: #eee;
    }


    /* shared */
    button {
      border: 0;
      border-radius: 10px;
      background: #1e6fd9;
      color: #fff;
      font-size: 16px;
      padding: 12px;
      cursor: pointer;
      margin: 5px;
    }

    button:active {
      opacity: .7;
    }

    select,
    input[type=text],
    input:not([type]) {
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #fff;
    }

    /* top fields */
    .field {
      display: block;
      margin: 12px 0 0;
      font-size: 13px;
      color: #555;
      font-weight: 600;
    }

    .field input,
    .field select {
      display: block;
      margin-top: 4px;
      font-weight: 400;
      color: #000;
    }

    /* step cards */
    .stepRow {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      grid-template-areas:
        "lbl lbl lbl"
        "kind req btns";
      gap: 8px;
      align-items: center;
      background: #f6f7f9;
      border: 1px solid #e2e4e8;
      border-radius: 12px;
      padding: 10px;
      margin: 10px 0;
    }

    .stepRow .lbl {
      grid-area: lbl;
      margin: 0;
    }

    .stepRow select {
      grid-area: kind;
      font-size: 16px;
      padding: 10px;
      width: 100%;
      margin: 0;
    }

    .stepRow .opts {
      grid-area: req;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
    }

    .stepRow .opts label {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stepRow .opts input {
      width: 24px;
      height: 24px;
      margin: 0;
      flex: none;
    }

    .stepRow .req input {
      width: 24px;
      height: 24px;
      margin: 0;
    }

    .stepRow .btns {
      grid-area: btns;
      display: flex;
      gap: 6px;
    }

    .stepRow .btns button {
      width: 44px;
      padding: 10px 0;
      background: #6b7280;
    }

    .stepRow .btns .danger {
      background: #d33;
    }

    /* action buttons */
    #addStep {
      background: #e8f0fc;
      color: #1e6fd9;
      width: 100%;
      margin-top: 4px;
    }

    #save {
      width: 100%;
      margin-top: 16px;
      padding: 16px;
      font-weight: 700;
    }

    #cancel {
      background: #6b7280;
      margin-bottom: 8px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: #1a7f37;
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 700;
      z-index: 10;
    }

    .toast.bad {
      background: #c62828;
    }

    textarea.lbl {
      grid-area: lbl;
      width: 100%;
      box-sizing: border-box;
      font: inherit;
      font-size: 16px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
      resize: vertical;
    }

    .instruction {
      white-space: pre-wrap;
      background: #fff8e1;
      border-left: 4px solid #f5b800;
      border-radius: 8px;
      padding: 12px;
      margin: 10px 0;
    }

    /* step cards */
    .step {
      display: block;
      background: #f6f7f9;
      border: 1px solid #e2e4e8;
      border-radius: 12px;
      padding: 12px;
      margin: 10px 0;
    }

    .stepLabel {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .star {
      color: #d33;
    }

    .step input[type=number],
    .step input[type=text] {
      width: 100%;
      margin: 0;
      box-sizing: border-box;
    }

    /* checkbox steps: label left, big box right, whole card is tappable */
    .step.check {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .step.check .stepLabel {
      margin: 0;
    }

    .step.check input {
      width: 32px;
      height: 32px;
      flex: none;
      margin: 0;
    }

    /* skipped required step */
    .step.missing {
      border-color: #d33;
      background: #fdecec;
    }

    .step.missing .stepLabel {
      color: #c00;
    }

    #finish {
      width: 100%;
      margin-top: 16px;
      padding: 16px;
      font-weight: 700;
      background: #1a7f37;
    }

    .assetHead {
      position: relative;
      min-height: 240px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: flex-start;
      background: #374151 center / cover;
      border-radius: 12px;
      margin: 8px 0;
      padding: 12px;
      overflow: hidden;
    }

    .assetHead .info {
      background: rgba(0, 0, 0, .20);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff;
      border-radius: 12px;
      padding: 8px 12px;
      max-width: calc(100% - 56px);
    }

    .info h1,
    .info p {
      margin: 2px 0;
    }

    .assetHead .camBtn {
      position: absolute;
      top: 10px;
      right: 10px;
    }

    .assetHead h1,
    .assetHead p {
      margin: 2px 0;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .6);
    }

    .camBtn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, .2);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, .35);
      font-size: 20px;
      cursor: pointer;
    }

    .camBtn:active {
      background: rgba(255, 255, 255, .35);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .topbar h1 {
      margin: 0;
    }

    .toolsBtn {
      width: auto;
      padding: 8px 14px;
      font-size: 20px;
      line-height: 1;
      background: #e8f0fc;
      border: 1px solid #c9d8f0;
      border-radius: 10px;
    }

    .toolsBtn:active {
      background: #d5e4fa;
    }

    .fileBtn {
      display: block;
      text-align: center;
      background: #1e6fd9;
      color: #fff;
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .modal {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      width: 80%;
      max-width: 320px;
      text-align: center;
    }

    .modal button {
      width: 100%;
      margin-top: 8px;
    }

    .modal .gray {
      background: #6b7280;
    }

    .chip {
      display: inline-block;
      background: #e8f0fc;
      border-radius: 12px;
      padding: 6px 10px;
      margin: 0 6px 6px 0;
    }

    .chip b {
      margin-left: 6px;
      cursor: pointer;
    }

    .picker {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pickerBox {
      background: #fff;
      border-radius: 12px;
      width: 92%;
      max-width: 480px;
      max-height: 92%;
      height: 92%;
      display: flex;
      flex-direction: column;
      padding: 14px;
      box-sizing: border-box;
    }

    #pResults {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    #pPicked {
      margin: 4px 0 8px;
      min-height: 32px;
    }

    .hint {
      color: #888;
      font-size: 14px;
    }

    .pickHead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .pickHead h2 {
      margin: 0;
    }

    .pickHead button {
      width: auto;
      padding: 8px 18px;
    }

    .picker h3 {
      margin: 16px 0 4px;
      font-size: 14px;
      color: #555;
    }

    .card.picked {
      position: relative;
      outline: 3px solid #1a7f37;
      outline-offset: -3px;
    }

    .card.picked::after {
      content: "✓";
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #1a7f37;
      color: #fff;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btnRow {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .btnRow button {
      flex: 1;
      width: auto;
      padding: 8px;
      margin: 0;
    }

    .dueBadge {
      display: inline-block;
      background: var(--due-edge);
      color: var(--due-ink);
      font-size: 12px;
      font-weight: 700;
      border-radius: 12px;
      padding: 2px 10px;
      margin: 10px;
    }

    .pmBtn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      padding: 8px 14px;
      margin: 6px 0;
      border-radius: 12px;
    }

    .pmText {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .pmText b {
      font-size: 16px;
    }

    .pmText small {
      font-size: 13px;
      opacity: .85;
    }

    .pmBtn .dueBadge {
      margin: 0;
      flex: none;
    }

    .step textarea {
      width: 100%;
      box-sizing: border-box;
      margin: 0;
      font: inherit;
      font-size: 16px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
      resize: none;
      overflow: hidden;
    }
  </style>

</head>

<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/idb@8.0.0/build/umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    window.onerror = (msg, src, line) => {
      document.body.innerHTML = "<pre>" + msg + " (line " + line + ")</pre>";
    };
  </script>
  <script>
    const app = document.getElementById("app");



    const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    const intervals = { quarterly: 3, semiannual: 6, annual: 12, biennial: 24 };


    const blankProc = {
      id: "blank", name: "General PM", version: 1, intervalMonths: 12, defaultHours: 0.25,
      match: [], exportTemplate: "PM Passed", steps: []
    };

    const serviceOrderProc = {
      id: "service-order", name: "Service Order", version: 1,
      intervalMonths: 12, defaultHours: 0.25,
      noSchedule: true, locked: true,
      match: [], exportTemplate: "{notes}",
      steps: [{ key: "notes", kind: "text", required: true, label: "Notes" }]
    };

    const cardHTML = a => `
  <div class="card ${dueIds.has(a.id) ? "due" : ""}" data-id="${esc(a.id)}">
    <div class="info">
      <div class="id">${esc(a.id)}</div>
      <div class="desc">${esc(a.description)}</div>
      <div class="loc">${esc(a.location)}</div>
    </div>
  </div>`;

    let scanner = null, scanBtn = null;

    async function stopScan() {
      if (!scanner) return;
      try { await scanner.stop(); } catch { }
      scanner = null;
      if (scanBtn) scanBtn.textContent = "Scan";
      scanBtn = null;
    }

    async function startScan(readerId, btn, onText) {
      scanner = new Html5Qrcode(readerId);
      scanBtn = btn;
      btn.textContent = "Cancel scan";
      try {
        await scanner.start({ facingMode: "environment" }, { fps: 10 },
          async text => { await stopScan(); onText(text); });
      } catch (err) {
        await stopScan();
        toast("Camera unavailable", true);
      }
    }

    async function shareOrDownload(file) {


      try {

        await navigator.share({ files: [file] });

        return;

      } catch (err) {
        alert("share error: " + err.name + " / " + err.message);
        if (err.name === "AbortError") return;
      }


      const a = document.createElement("a");
      a.href = URL.createObjectURL(file);
      a.download = file.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }

    async function buildStaticFile() {
      const db = await dbPromise;
      const bundle = {
        kind: "pmpal-static",
        exportedAt: new Date().toISOString(),
        procedures: await db.getAll("procedures"),
        assetData: await db.getAll("assetData")
      };
      return new File([JSON.stringify(bundle, null, 2)], "pmpal-static.json", { type: "application/json" });
    }

    async function buildStaticCSV() {
      const db = await dbPromise;
      const cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;

      const lines = [["type", "id", "version", "updated", "data"].map(cell).join(",")];

      (await db.getAll("procedures")).forEach(p =>
        lines.push(["procedure", p.id, p.version, "", JSON.stringify(p)].map(cell).join(",")));

      (await db.getAll("assetData")).forEach(a => {
        const { snoozed, ...clean } = a;   // snooze stays on this phone
        lines.push(["assetData", a.id, "", a.updated || "", JSON.stringify(clean)].map(cell).join(","));
      });

      return new File([lines.join("\n")], "pmpal-static.csv", { type: "text/csv" });
    }

    function askShare(file, onSent, label = "Your file") {
      const canShare = !!navigator.canShare?.({ files: [file] });

      const ov = document.createElement("div");
      ov.className = "overlay";
      ov.innerHTML = `
    <div class="modal">
      <p><b>${esc(label)} is ready</b></p>
      ${canShare ? `<button id="mShare">Send it</button>` : ""}
      <button id="mSave" ${canShare ? 'class="gray"' : ""}>Save to phone</button>
      <button id="mCancel" class="gray">Cancel</button>
    </div>`;
      document.body.appendChild(ov);

      ov.querySelector("#mCancel").onclick = () => ov.remove();

      ov.querySelector("#mSave").onclick = () => {
        saveFile(file);
        ov.remove();
        onSent?.();
      };

      ov.querySelector("#mShare")?.addEventListener("click", async () => {
        try {
          await navigator.share({ files: [file] });   // first thing in the tap, nothing awaited before it
          ov.remove();
          onSent?.();
        } catch (err) {
          if (err.name === "AbortError") return;        // they backed out of the share sheet: popup stays
          toast("Couldn't open sharing. Use Save to phone", true);
        }
      });
    }

    async function exportStatic() {
      try {
        const db = await dbPromise;
        const bundle = {
          kind: "pmpal-static",
          exportedAt: new Date().toISOString(),
          procedures: await db.getAll("procedures"),
          assetData: await db.getAll("assetData")
        };
        const file = new File([JSON.stringify(bundle, null, 2)], "pmpal-static.json", { type: "application/json" });
        await shareOrDownload(file);
      } catch (err) {
        if (err.name !== "AbortError") alert("Export failed: " + err);
      }
    }

    function buildCloseoutXLSX(list) {
      const cols = ["E NUMBER", "WORKER NUMBER", "TIME TO COMPLETE", "CLOSE MESSAGE", "EQUIPMENT USED"];

      const rows = list.map(r => ({
        "E NUMBER": r.assetId,
        "WORKER NUMBER": /^\d+$/.test(r.techId || "") ? Number(r.techId) : (r.techId ?? ""),
        "TIME TO COMPLETE": r.hours ?? "",
        "CLOSE MESSAGE": recordText(r),
        "EQUIPMENT USED": (r.toolsUsed || []).join(", ")
      }));

      const ws = XLSX.utils.json_to_sheet(rows, { header: cols });
      ws["!cols"] = [{ wch: 14 }, { wch: 16 }, { wch: 18 }, { wch: 100 }, { wch: 30 }];

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Sheet1");

      const bytes = XLSX.write(wb, { bookType: "xlsx", type: "array" });
      return new File([bytes], `closeout-${new Date().toISOString().slice(0, 10)}.xlsx`,
        { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    }

    async function reimportAssets(file) {
      try {
        const rows = parseAssetCSV(await file.text());
        if (!rows.length) throw new Error("No rows found");

        const db = await dbPromise;
        const tx = db.transaction("assets", "readwrite");
        await tx.store.clear();
        rows.forEach(r => tx.store.put(r));
        await tx.done;

        toast(`Imported ${rows.length} assets`);
        showHomeScreen();
      } catch (err) {
        alert("Import failed, nothing changed: " + err);
      }
    }

    async function importStatic(file) {
      try {
        const rows = parseCSV(await file.text());
        if (rows[0]?.[0] !== "type") throw new Error("Not a PM-pal static data file");

        const db = await dbPromise;
        let nProc = 0, nData = 0;

        for (const [type, id, , , data] of rows.slice(1)) {
          if (!data) continue;
          const obj = JSON.parse(data);

          if (type === "procedure") {
            const mine = await db.get("procedures", obj.id);
            if (!mine || obj.version > mine.version) { await db.put("procedures", obj); nProc++; }
          } else if (type === "assetData") {
            const mine = await db.get("assetData", obj.id);
            if (!mine || (obj.updated || "") > (mine.updated || "")) {
              // keep this phone's own snooze, since exported files never carry one
              await db.put("assetData", { ...obj, ...(mine?.snoozed ? { snoozed: mine.snoozed } : {}) });
              nData++;
            }
          }
        }

        await loadProcs();
        toast(`Imported ${nProc} procedures, ${nData} asset entries`);
      } catch (err) {
        alert("Import failed: " + err);
      }
    }

    async function exportPhotos() {
      try {
        const db = await dbPromise;
        const keys = await db.getAllKeys("photos");
        if (!keys.length) { toast("No photos yet", true); return; }

        toast("Building zip...");
        const zip = new JSZip();
        for (const k of keys) {
          const dataUrl = await db.get("photos", k);
          zip.file(encodeURIComponent(k) + ".jpg", dataUrl.split(",")[1], { base64: true });
        }

        const blob = await zip.generateAsync({ type: "blob", compression: "STORE" });
        askShare(new File([blob], "pmpal-photos.zip", { type: "application/zip" }));
      } catch (err) {
        alert("Export failed: " + err);
      }
    }

    async function importPhotos(file) {
      try {
        const zip = await JSZip.loadAsync(file);
        const db = await dbPromise;
        let added = 0, skipped = 0;

        for (const entry of Object.values(zip.files)) {
          if (entry.dir || !entry.name.endsWith(".jpg")) continue;
          const id = decodeURIComponent(entry.name.slice(0, -4));
          if (await db.getKey("photos", id) !== undefined) { skipped++; continue; }

          const b64 = await entry.async("base64");
          await db.put("photos", "data:image/jpeg;base64," + b64, id);
          added++;
        }
        toast(`Added ${added} photos, skipped ${skipped}`);
      } catch (err) {
        alert("Import failed: " + err);
      }
    }

    async function addCardPhotos(root = document.getElementById("results")) {
      const db = await dbPromise;
      for (const card of root.querySelectorAll(".card")) {
        const photo = await db.get("photos", card.dataset.id);
        if (photo) {
          card.style.setProperty("--photo", `url('${photo}')`);
          card.classList.add("hasPhoto");

    function shrinkPhoto(file, maxW = 320) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxW / img.width);
          const c = document.createElement("canvas");
          c.width = img.width * scale;
          c.height = img.height * scale;
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(img.src);
          resolve(c.toDataURL("image/jpeg", 0.5));
        };
        img.src = URL.createObjectURL(file);
      });
    }

    async function toolHistory(assetId) {
      const recs = await (await dbPromise).getAll("records");
      recs.sort((a, b) => b.date.localeCompare(a.date));   // newest first

      const seen = new Set(), here = [], other = [];
      function collect(list, out) {
        for (const r of list) for (const t of r.toolsUsed || []) {
          if (!seen.has(t)) { seen.add(t); out.push(t); }
        }
      }
      collect(recs.filter(r => r.assetId === assetId), here);   // this equipment first
      collect(recs, other);                                      // then everything else
      return { here, other };
    }

    function searchAssets(q, dueFirst = true) {
      q = q.trim().toUpperCase();
      if (!q) return [];

      const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const words = q.split(/\s+/).filter(Boolean);
      const wholeWord = words.map(w => new RegExp(`(^|[^A-Z0-9])${reEsc(w)}($|[^A-Z0-9])`));

      const exact = [], partial = [];
      for (const a of all) {
        const text = (a.id + " " + a.description + " " + a.location).toUpperCase();

        if (a.id.toUpperCase() === q || wholeWord.every(r => r.test(text))) exact.push(a);
        else if (words.every(w => text.includes(w))) partial.push(a);
      }

      const rank = a => a.id.toUpperCase() === q ? 0 : (dueFirst && dueIds.has(a.id)) ? 1 : 2;
      exact.sort((a, b) => rank(a) - rank(b));
      if (dueFirst) partial.sort((a, b) => dueIds.has(b.id) - dueIds.has(a.id));

      return [...exact, ...(q.length < 4 ? partial.slice(0, 50) : partial)];
    }

    async function loadDue() {
      const db = await dbPromise;
      const [data, recs] = await Promise.all([db.getAll("assetData"), db.getAll("records")]);
      const now = new Date();
      const nowIdx = now.getFullYear() * 12 + now.getMonth();

      const doneNow = new Set(recs
        .filter(r => { const d = new Date(r.date); return d.getFullYear() * 12 + d.getMonth() === nowIdx; })
        .map(r => r.assetId + "|" + r.procedure));

      dueIds = new Set(); dueProcs = {};
      for (const d of data) {
        if (!/^\d{4}-\d\d$/.test(d.pmAnchor || "")) continue;   // skips "none" and unset
        if (d.snoozed === monthKey()) continue;                  // snooze clears all of them
        const asset = await db.get("assets", d.id);
        if (!asset) continue;

        const [y, m] = d.pmAnchor.split("-");
        const gap = nowIdx - (+y * 12 + (+m - 1));

        for (const p of findProcedures(asset)) {
          const interval = Number(p.intervalMonths);
          if (![3, 6, 12, 24].includes(interval)) continue;
          if (((gap % interval) + interval) % interval !== 0) continue;
          if (doneNow.has(d.id + "|" + p.id)) continue;          // this PM already done this month
          (dueProcs[d.id] ||= new Set()).add(p.id);
          dueIds.add(d.id);
        }
      }
    }

    function parseCSV(text) {
      text = text.replace(/^\uFEFF/, "");
      const rows = [];
      let row = [], field = "", inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
          if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
          else if (c === '"') inQuotes = false;
          else field += c;
        } else if (c === '"') inQuotes = true;
        else if (c === ",") { row.push(field); field = ""; }
        else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
        else if (c !== "\r") field += c;
      }
      if (field || row.length) { row.push(field); rows.push(row); }
      return rows;
    }

        try { localStorage.setItem("techId", techId); } catch { }

        const hours = parseFloat(document.getElementById("hours").value);
        if (isNaN(hours) || hours <= 0) { toast("Enter a time charge", true); return; }

        try {
          const db = await dbPromise;

          if (existing) {
            // EDIT: overwrite the same record, keep its original date and due date
            const { key, ...rec } = existing;
            await db.put("records", {
              ...rec,
              techId,
              values,
              toolsUsed,
              hours,
              version: proc.version,
              edited: new Date().toISOString()
            }, key);

            toast("Record updated ✓");
            showRecordsScreen();

          } else {
            // NEW: add a record, then remember the per-asset values
            const date = new Date().toISOString();

            const data = await db.get("assetData", asset.id);
            if (!data?.pmAnchor) {
              const n = new Date();
              await patchAssetData(asset.id, {
                pmAnchor: `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, "0")}`
              });
            }

            await db.add("records", {
              assetId: asset.id,
              techId,
              procedure: proc.id,
              version: proc.version,
              date,
              nextDue: addMonths(date, proc.intervalMonths),
              exported: false,
              values,
              hours,
              toolsUsed
            });

            const linked = {};
            proc.steps.forEach(s => {
              if (s.perAsset && values[s.key] !== "") linked[s.key] = values[s.key];
            });
            const prevValues = data?.values || {};
            await patchAssetData(asset.id, { values: { ...prevValues, ...linked } });

            toast("PM saved ✓");
            showAssetScreen(asset);
          }
        } catch (err) {
          alert(err);
          toast("Save failed", true);
        }
      };
    }

    function showProcEditor(proc, asset, onDone) {

      const p = proc
        ? structuredClone(proc)
        : {
          id: crypto.randomUUID(),
          name: asset?.description ? asset.description.toLowerCase() + " Procedure" : "New Procedure",
          version: 0,
          intervalMonths: 12,
          match: asset?.description ? [asset.description.toUpperCase()] : [],
          steps: []
        };

      function syncTop() {
        p.defaultHours = Number(document.getElementById("hours").value) || 0;
        p.name = document.getElementById("name").value;
        p.intervalMonths = Number(document.getElementById("interval").value);
        p.match = document.getElementById("match").value.split(",").map(m => m.trim().toUpperCase()).filter(Boolean);
        p.exportTemplate = document.getElementById("tmpl").value;
      }

      function move(from, to) {
        if (to < 0 || to >= p.steps.length) return;
        const [s] = p.steps.splice(from, 1);   // pull it out
        p.steps.splice(to, 0, s);              // drop it in
        draw();
      }

      function draw() {

        const slug = l => l.toLowerCase().replace(/\W+/g, "_");
        const keyOf = s => s.key || slug(s.label);
        const holders = ["id", "date", "nextDue", "hours", "tools",
          ...p.steps.filter(s => s.kind !== "instruction").map(keyOf)];

        app.innerHTML = `
          <button id="cancel">← Cancel</button>
          <label class="field">Procedure Name <input id="name" value="${esc(p.name)}"> </label>
          <label class="field">Repeats Every <select id="interval">
            ${[3, 6, 12, 24].map(m => `<option value="${m}" ${p.intervalMonths === m ? "selected" : ""}>${m} months</option>`).join("")}
          </select></label>
          <label class="field">Matches descriptions containing <input id="match" value="${esc(p.match.join(", "))}" placeholder="Matches descriptions containing..."></label>
          <label class="field">Export template <input id="tmpl" value="${esc(p.exportTemplate || "")}" placeholder="Export template"></label>
          <div class="holders">
            ${holders.map(h => `<span class="chip" data-ph="${h}">{${h}}</span>`).join("")}
          </div>
          ${p.steps.map((s, i) => `
            <div class="stepRow">
              ${s.kind === "instruction"
            ? `<textarea class="lbl" rows="5" data-i="${i}" data-f="label">${esc(s.label)}</textarea>`
            : `<input class="lbl" data-i="${i}" data-f="label" value="${esc(s.label)}">`}
              <select data-i="${i}" data-f="kind">
                ${["check", "number", "text", "instruction"].map(k => `<option ${s.kind === k ? "selected" : ""}>${k}</option>`).join("")}
              </select>
              <div class="opts">
                <label><input type="checkbox" data-i="${i}" data-f="required" ${s.required ? "checked" : ""}> Required</label>
                ${s.kind === "number" || s.kind === "text" ? `
                <label><input type="checkbox" data-i="${i}" data-f="perAsset" ${s.perAsset ? "checked" : ""}> Remember per asset</label>` : ""}
              </div>
              <div class="btns">
                <button data-up="${i}">↑</button>
                <button data-down="${i}">↓</button>
                <button class="danger" data-del="${i}">✕</button>
              </div>
            </div>`).join("")}
          <button id="addStep">+ Add step</button>
          <label class="field">Default time charge (hours)
            <input id="hours" type="number" inputmode="decimal" step="0.25" min="0" value="${p.defaultHours ?? ""}">
          </label>
          <button id="save">Save</button>`;
        // wire handlers (below)

        app.querySelectorAll("[data-f]").forEach(el => {
          el.onchange = () => {
            const s = p.steps[el.dataset.i];
            s[el.dataset.f] = el.type === "checkbox" ? el.checked : el.value;
            if (el.dataset.f === "kind") { syncTop(); draw(); }
          };
        });

        app.querySelectorAll("[data-ph]").forEach(c => {
          c.onclick = () => {
            syncTop();
            p.exportTemplate = (p.exportTemplate || "") + `{${c.dataset.ph}}`;
            draw();
          };
        });

        app.querySelectorAll("[data-up]").forEach(b => {
          b.onclick = () => { syncTop(); move(+b.dataset.up, +b.dataset.up - 1); };
        });

        app.querySelectorAll("[data-down]").forEach(b => {
          b.onclick = () => { syncTop(); move(+b.dataset.down, +b.dataset.down + 1); };
        });

        app.querySelectorAll("[data-del]").forEach(b => {
          b.onclick = () => { syncTop(); p.steps.splice(+b.dataset.del, 1); draw(); };
        });




        document.getElementById("addStep").onclick = () => {
          p.steps.push({ key: "", label: "New step", kind: "check", required: false });
          draw();
        };
        // data-del: p.steps.splice(i, 1); draw()
        // data-up:  swap p.steps[i] with p.steps[i - 1]; draw()

        document.getElementById("cancel").onclick = () => onDone();

        document.getElementById("save").onclick = async () => {
          syncTop();   // if you have it; otherwise keep your four p.name / p.intervalMonths / p.match / p.exportTemplate lines
          p.steps.forEach(s => { if (!s.key) s.key = s.label.toLowerCase().replace(/\W+/g, "_"); });
          p.version++;

          try {
            await (await dbPromise).put("procedures", p);
            await loadProcs();
          } catch (err) {
            toast("Save failed", true);
            return;                    // stay on the editor so nothing typed is lost
          }

          toast("Saved ✓");
          onDone();
        };

      }
      draw();
    }

    async function showRecordsScreen() {
      const recs = await loadRecords();
      app.innerHTML = `
    <button id="back">← Back</button>
    <h2>Records</h2>
    <button id="exportNew">Export new (${recs.filter(r => !r.exported).length})</button>
    <button id="exportAll">Export all</button>
    ${recs.map(r => `
      <div class="card">
        <div class="id">${esc(r.assetId)} ${r.exported ? "✓" : ""}</div>
        <div class="desc">${esc(r.date.slice(0, 10))} · due ${esc(r.nextDue)}</div>
        <div class="loc">${esc(recordText(r))}</div>
        <div class="btnRow">
          <button data-edit="${r.key}">Edit</button>
          <button class="danger" data-del="${r.key}">Delete</button>
        </div>
      </div>`).join("")}`;

      document.getElementById("back").onclick = showToolsScreen;
      document.getElementById("exportNew").onclick = () => exportRecords(recs.filter(r => !r.exported));
      document.getElementById("exportAll").onclick = () => exportRecords(recs);




      app.onclick = async e => {
        const b = e.target.closest("button");
        if (!b) return;

        if (b.dataset.edit !== undefined) {
          const rec = recs.find(r => r.key === +b.dataset.edit);
          const proc = getProc(rec.procedure);
          const asset = await (await dbPromise).get("assets", rec.assetId);
          if (!proc || !asset) { toast("Can't edit: procedure or asset missing", true); return; }
          runProcedure(asset, proc, rec);
          return;
        }
        if (!b || b.dataset.del === undefined) return;
        if (!confirm("Delete this record?")) return;
        await (await dbPromise).delete("records", +b.dataset.del);
        showRecordsScreen();
      };
    }

    function showToolsScreen() {
      stopScan()


      app.innerHTML = `
    <button id="back">← Back</button>
    <h2>Tools</h2>
    <button id="recordsBtn">Records</button>
    <button id="expStatic">Export static data</button>
    <label class="fileBtn">Import static data <input type="file" accept=".csv" id="impStatic" hidden></label>
    <button id="expImages">Export images (ZIP)</button>
    <label class="fileBtn">Import images (ZIP) <input type="file" accept=".zip" id="impPhotos" hidden></label>
    <label class="fileBtn">Re-import asset list (CSV) <input type="file" accept=".csv" id="impAssets" hidden></label>
    <button id="clearPhotosProcs" class="danger">Delete photos + procedures (testing)</button>
    <button id="procList">Procedures</button>
    `;

      document.getElementById("procList").onclick = showProcList;
      document.getElementById("back").onclick = showHomeScreen;
      document.getElementById("expStatic").onclick = async () => {
        try {
          askShare(await buildStaticCSV());
        } catch (err) {
          alert("Export failed: " + err);
        }
      };

      document.getElementById("expImages").onclick = async () => exportPhotos();

      document.getElementById("clearPhotosProcs").onclick = async () => {
        if (!confirm("Delete all photos and procedures on this phone?")) return;
        try {
          const db = await dbPromise;
          await db.clear("photos");
          await db.clear("procedures");
          await loadProcs();   // refills procedures from your hardcoded defaults
          toast("Photos and procedures deleted");
        } catch (err) {
          alert("Delete failed: " + err);
        }
      };

      document.getElementById("impStatic").onchange = e => importStatic(e.target.files[0]);

      document.getElementById("impPhotos").onchange = e => importPhotos(e.target.files[0]);

      document.getElementById("impAssets").onchange = e => {
        if (!confirm("Replace this phone's asset list?")) { e.target.value = ""; return; }
        reimportAssets(e.target.files[0]);
      };

      document.getElementById("recordsBtn").onclick = () =>
  showRecordsScreen().catch(err => alert("Records: " + err));
    }

    async function showToolPicker(asset, toolsUsed, onDone) {
      const db = await dbPromise;
      if (!all.length) all = await db.getAll("assets");
      const hist = await toolHistory(asset.id);

      const ov = document.createElement("div");
      ov.className = "picker";
      ov.innerHTML = `
  <div class="pickerBox">
    <div class="pickHead"><h2>Equipment used</h2><button id="pDone">Done</button></div>
    <div id="pPicked"></div>
    <input id="pSearch" placeholder="Search equipment" autocapitalize="characters" autocorrect="off" spellcheck="false">
    <button id="pScan">Scan</button>
    <div id="pReader"></div>
    <div id="pResults"></div>
  </div>`;
      document.body.appendChild(ov);

      function fitPicker() {
        const vv = window.visualViewport;
        if (!vv) return;
        ov.style.top = vv.offsetTop + "px";
        ov.style.height = vv.height + "px";
        ov.style.bottom = "auto";
      }
      window.visualViewport?.addEventListener("resize", fitPicker);
      window.visualViewport?.addEventListener("scroll", fitPicker);


      const box = ov.querySelector("#pResults");
      const search = ov.querySelector("#pSearch");
      const pickedBox = ov.querySelector("#pPicked");
      const byId = async ids => (await Promise.all(ids.map(id => db.get("assets", id)))).filter(Boolean);

      async function draw(q) {
        let html;
        if (q.trim()) {
          html = searchAssets(q, false).map(cardHTML).join("");
        } else {
          const here = await byId(hist.here), other = await byId(hist.other);
          html = (here.length ? `<h3>Used on this equipment before</h3>${here.map(cardHTML).join("")}` : "")
            + (other.length ? `<h3>Your equipment</h3>${other.map(cardHTML).join("")}` : "");
          if (!html) html = `<p>Search or scan to add equipment.</p>`;
        }
        box.innerHTML = html;
        box.querySelectorAll(".card").forEach(c => c.classList.toggle("picked", toolsUsed.includes(c.dataset.id)));
        addCardPhotos(box);
      }

      box.onclick = e => {
        const c = e.target.closest(".card");
        if (!c) return;
        const i = toolsUsed.indexOf(c.dataset.id);
        i === -1 ? toolsUsed.push(c.dataset.id) : toolsUsed.splice(i, 1);
        syncChecks();
        drawPicked();
      };

      search.oninput = () => draw(search.value);
      search.onfocus = stopScan;
      ov.querySelector("#pScan").onclick = e =>
        scanner ? stopScan() : startScan("pReader", e.target, t => { search.value = t; draw(t); });
      ov.querySelector("#pDone").onclick = () => {
        stopScan();
        window.visualViewport?.removeEventListener("resize", fitPicker);
        window.visualViewport?.removeEventListener("scroll", fitPicker);
        ov.remove();
        onDone();
      };

      function drawPicked() {
        pickedBox.innerHTML = toolsUsed.length
          ? toolsUsed.map((id, i) => `<span class="chip">${esc(id)} <b data-prm="${i}">✕</b></span>`).join("")
          : `<span class="hint">Nothing picked yet</span>`;
      }

      function syncChecks() {
        box.querySelectorAll(".card").forEach(c =>
          c.classList.toggle("picked", toolsUsed.includes(c.dataset.id)));
      }

      pickedBox.onclick = e => {
        const b = e.target.closest("[data-prm]");
        if (!b) return;
        toolsUsed.splice(+b.dataset.prm, 1);
        syncChecks();
        drawPicked();
      };

      drawPicked();
      draw("");
      fitPicker();
    }

    function showProcList() {
      stopScan();
      app.innerHTML = `
    <button id="back">← Back</button>
    <h2>Procedures (${procs.length})</h2>
    <input id="psearch" placeholder="Search procedures" autocorrect="off" spellcheck="false">
    <button id="newProc">+ New procedure</button>
    <div id="plist"></div>`;

      const list = document.getElementById("plist");

      function draw(q = "") {
        q = q.trim().toUpperCase();
        const shown = procs
          .filter(p => !q || (p.name + " " + p.match.join(" ")).toUpperCase().includes(q))
          .sort((a, b) => a.name.localeCompare(b.name));

        list.innerHTML = shown.map(p => `
      <div class="card" data-id="${esc(p.id)}">
        <div class="info">
          <div class="id">${esc(p.name)}</div>
          <div class="desc">${p.steps.filter(s => s.kind !== "instruction").length} steps · every ${p.intervalMonths} months · v${p.version}</div>
          <div class="loc">${esc(p.match.join(", "))}</div>
        </div>
        ${p.id === "blank" ? "" : `<button class="danger" data-del="${esc(p.id)}">Delete</button>`}
      </div>`).join("") || "<p>No procedures found.</p>";
      }
      draw();

      document.getElementById("psearch").oninput = e => draw(e.target.value);
      document.getElementById("back").onclick = showToolsScreen;
      document.getElementById("newProc").onclick = () => showProcEditor(null, null, showProcList);

      list.onclick = async e => {
        const del = e.target.closest("[data-del]");
        if (del) {
          if (!confirm("Delete this procedure from this phone?")) return;
          await (await dbPromise).delete("procedures", del.dataset.del);
          await loadProcs();
          showProcList();
          return;
        }
        const card = e.target.closest(".card");
        if (!card) return;
        showProcEditor(procs.find(p => p.id === card.dataset.id), null, showProcList);
      };
    }

    async function boot() {
      await loadProcs();
      try {
        const db = await dbPromise;
        if (await db.count("assets") === 0) showImportScreen();
        else showHomeScreen();

        await loadProcs()

      } catch (err) {
        app.innerHTML = "<pre>" + err + "</pre>";
      }



    }

    boot();

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
  </script>
